name: Android validation (DEMO only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org=ma.payday --project-name=payday_mobile .
      - name: Harden Android manifest
        run: python3 tool/harden_android.py
      - name: Get dependencies
        run: flutter pub get
      - name: Check Dart source
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Compile debug APK (not configured for OAuth)
        run: flutter build apk --debug
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: payday-demo-debug-unconfigured
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
