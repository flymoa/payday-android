name: Android validation (DEMO only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: payday-android-debug-signing-v1
      - name: Prepare APK signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          fingerprint="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey | sed -n 's/^.*SHA1: *//p' | head -n 1)"
          test -n "$fingerprint"
          echo "SHA-1 fingerprint for this GitHub-built debug APK: $fingerprint"
          echo "### Payday Android — debug APK SHA-1" >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-1: %s\n' "$fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "Development only. The fingerprint may change if the Actions cache expires." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org=ma.payday --project-name=payday_mobile .
      - name: Harden Android manifest
        run: python3 tool/harden_android.py
      - name: Get dependencies
        run: flutter pub get
      - name: Check Dart source
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Compile debug APK (not configured for OAuth)
        run: flutter build apk --debug
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: payday-demo-debug-unconfigured
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
