name: Android validation (DEMO only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      web_client_id:
        description: 'Google Web OAuth client ID (not Android client ID; not a secret)'
        required: false
        type: string
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ inputs.web_client_id || vars.PAYDAY_GOOGLE_WEB_CLIENT_ID || '735410421842-9gjsuft9cns8256lepc6pv0vqe3qefng.apps.googleusercontent.com' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: payday-android-debug-signing-v1
      - name: Prepare APK signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          fingerprint="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey | sed -n 's/^.*SHA1: *//p' | head -n 1)"
          test -n "$fingerprint"
          echo "SHA-1 fingerprint for this GitHub-built debug APK: $fingerprint"
          echo "### Payday Android — debug APK SHA-1" >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-1: %s\n' "$fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "Development only. The fingerprint may change if the Actions cache expires." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org=ma.payday --project-name=payday_mobile .
      - name: Harden Android manifest
        run: python3 tool/harden_android.py
      - name: Get dependencies
        run: flutter pub get
      - name: Check Dart source
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Check Google OAuth build configuration
        shell: bash
        run: |
          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo '### Google OAuth: NOT CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Provide a Web application client ID using Run workflow → web_client_id to enable sign-in.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! "$GOOGLE_WEB_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+[.]apps[.]googleusercontent[.]com$ ]]; then
            echo 'ERROR: Input does not look like a Google Web application OAuth client ID.'
            exit 1
          else
            echo '### Google OAuth: Web client ID included' >> "$GITHUB_STEP_SUMMARY"
            echo 'App targets the isolated Payday DEMO validation copy for all writes.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile debug APK for isolated DEMO test copy
        shell: bash
        run: |
          flutter build apk --debug \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" \
            --dart-define="PAYDAY_TEST_SHEET_ID=1gpWUxFX4PI3fiImiiO_oz-nsLrx0ixHmQyx78MhcjmU"
      - name: Verify compiled APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"
          package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$package" = "ma.payday.payday_mobile"
          "$apksigner" verify "$apk"
          apk_sha="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-1 digest: *//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          key_sha="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey | sed -n 's/^.*SHA1: *//p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$apk_sha" && test "$apk_sha" = "$key_sha"
          echo '### Verified installed APK identity' >> "$GITHUB_STEP_SUMMARY"
          printf 'Android package: %s\\n' "$package" >> "$GITHUB_STEP_SUMMARY"
          printf 'APK SHA-1: %s\\n' "$apk_sha" >> "$GITHUB_STEP_SUMMARY"
          echo 'Signing certificate matches the SHA-1 displayed above.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: payday-demo-debug-test-copy
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
