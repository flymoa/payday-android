name: PAYDAY — create permanent signing backup
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/payday-signing-bootstrap.yml']
permissions:
  contents: read
jobs:
  create-encrypted-key:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create permanent key and encrypted backup
        env:
          BACKUP_PASSWORD: ${{ secrets.PAYDAY_SIGNING_BACKUP_PASSWORD }}
          EXISTING_KEY: ${{ secrets.PAYDAY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_PASSWORD" || { echo "::error::Set PAYDAY_SIGNING_BACKUP_PASSWORD first"; exit 1; }
          test -z "$EXISTING_KEY" || { echo "::error::Permanent key already configured; refusing to create another"; exit 1; }
          mkdir -p "$RUNNER_TEMP/payday-signing-backup"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/payday-release.p12" \
            -storepass:env BACKUP_PASSWORD -keypass:env BACKUP_PASSWORD \
            -alias payday -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=PAYDAY Local, O=PAYDAY, C=MA"
          keytool -exportcert -keystore "$RUNNER_TEMP/payday-release.p12" \
            -storepass:env BACKUP_PASSWORD -alias payday \
            -file "$RUNNER_TEMP/payday-signing-backup/payday-release.cer"
          sha256sum "$RUNNER_TEMP/payday-signing-backup/payday-release.cer" | cut -d' ' -f1 | tee "$RUNNER_TEMP/payday-signing-backup/certificate-sha256.txt"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -pass env:BACKUP_PASSWORD -in "$RUNNER_TEMP/payday-release.p12" \
            -out "$RUNNER_TEMP/payday-signing-backup/payday-release.p12.enc"
          printf '%s\n' 'Encrypted signing backup. Keep this archive and its password separately. Never upload the decrypted key to chat or commit it to git.' > "$RUNNER_TEMP/payday-signing-backup/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: payday-permanent-signing-backup
          path: ${{ runner.temp }}/payday-signing-backup/
          retention-days: 7
          if-no-files-found: error
