name: payday_local
description: Fully offline personal finance tracker. No accounts or network services.
publish_to: none
version: 1.2.8+14
environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^10.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.6
  # Compatible SQLite API for the desktop-only database test backend.
  sqlite3: ">=2.7.0 <3.0.0"
flutter:
  uses-material-design: true








