name: payday_local
description: Fully offline personal finance tracker. No accounts or network services.
publish_to: none
version: 2.3.0+41
environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  flutter_local_notifications: 22.3.2
  cryptography: 2.9.0
  local_auth: 3.0.2
  sqflite: ^2.4.2
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^10.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.6
  # Compatible SQLite API for the desktop-only database test backend.
  sqlite3: ">=2.7.0 <3.0.0"
flutter:
  uses-material-design: true















  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700





