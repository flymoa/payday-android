name: payday_mobile
description: Private Android expense capture for the Payday DEMO Google Sheet
publish_to: none
version: 0.5.1+6
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  uuid: ^4.6.0
# TEMPORARY DIAGNOSTIC PIN: Flutter issue 187229 reports that the newer
# Android Credential Manager implementation cancels account selection on
# some devices, while google_sign_in_android 7.2.7 works.
# Remove the override after comparing device sign-in results.
dependency_overrides:
  google_sign_in_android: 7.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
